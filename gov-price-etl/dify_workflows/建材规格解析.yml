    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 依据 prompts.yml/batch_spec_parse 调用 LLM 从规格文本中抽取结构化业务属性与解析规则
        model:
          completion_params: {}
          mode: chat
          name: minimax-m2.7
          provider: langgenius/minimax/minimax
        prompt_template:
        - id: cf5f95d8-3b5e-40d7-b032-54df8c7d1cb9
          role: system
          text: "你是建材规格解析规则生成专家。\n\n任务：根据规格文本生成可直接进入规则库的解析规则，而不是解析当前样本。\n\n==============================\n\
            输出要求\n==============================\n\n仅输出合法 JSON。\n\n禁止 Markdown。\n\
            禁止解释。\n禁止思考过程。\n禁止注释。\n\n输入几条，输出几条，顺序必须一致。\n\n输出格式：\n\n{\n  \"ok\": true,\n\
            \  \"results\": [\n    {\n      \"ok\": true,\n      \"confidence\": 0.95,\n\
            \      \"suggestions\": [\n        {\n          \"note\": \"\",\n    \
            \      \"attr\": \"\",\n          \"pattern\": \"\",\n          \"code_block\"\
            : \"\"\n        }\n      ]\n    }\n  ],\n  \"err_msg\": \"\"\n}\n\n==============================\n\
            核心原则\n==============================\n\n生成的是\"规则\"，不是\"样本匹配\"。\n\n规则必须具有行业通用性，而不是只能匹配当前输入。\n\
            \n不要生成：\n\n^(普通玻璃)$\n^(矩形)$\n^(镀锌)$\n\n优先生成同类规格的通用规则，例如：\n\n普通玻璃\n→\n\
            (普通玻璃|中空玻璃|钢化玻璃|LOW[- ]?E玻璃|夹胶玻璃)\n\n矩形\n→\n(矩形|方形|圆形)\n\nT型\n→\n([TULH]型)\n\
            \n镀锌\n→\n(镀锌|喷塑|拉丝|抛光|阳极氧化)\n\n==============================\n解析优先级（必须严格遵守）\n\
            ==============================\n\n按以下顺序判断：\n\n① 黑名单\n\n↓\n\n② 数值规格\n\n\
            ↓\n\n③ 型号规格\n\n↓\n\n④ 枚举规格\n\n↓\n\n⑤ 产品名称\n\n命中上一层后立即停止，不允许继续判断。\n\n==============================\n\
            ① 黑名单\n==============================\n\n规格属于以下任意值：\n\n其它\n其他\n一般\n一般型\n\
            无\n未分类\n型\n\n直接：\n\nok=false\n\nsuggestions=[]\n\nconfidence=0\n\n==============================\n\
            ② 数值规格（最高优先级）\n==============================\n\n规格中只要存在：\n\n数字\n\n或\n\
            \nDN\nPN\nMPa\nBAR\nbar\nmm\ncm\nm\nkg\nKN\nV\nA\n℃\n%\n×\n\nφ\n\nΦ\n\n\
            ×\n\n即进入数值解析。\n\n禁止进入：\n\nmaterial\n\nform\n\nsurface_treatment\n\ncolor\n\
            \nfeatures\n\n等枚举解析。\n\n例如：\n\nDN150\n\nDN150 PN1.6MPa\n\n200×100×8\n\n\
            M12×80\n\nφ20\n\n3×25+2×16\n\nPO42.5\n\n全部优先解析数值字段。\n\n==============================\n\
            ③ 型号规格\n==============================\n\n存在型号时解析：\n\nmodel\n\ntemper\n\
            \nalloy\n\nip_rating\n\n例如：\n\n6063\n\n6061\n\n7075\n\nT4\n\nT5\n\nT6\n\
            \nIP65\n\nKVV\n\nYJV\n\n==============================\n④ 枚举规格\n==============================\n\
            \n仅当：\n\n没有任何数字\n\n没有任何尺寸\n\n没有任何压力\n\n没有任何型号\n\n时，允许进入枚举解析。\n\n允许字段：\n\
            \nmaterial\n\nform\n\ncolor\n\nusage\n\nfeatures\n\nfiber_type\n\nfire_rating\n\
            \ntemper\n\nalloy\n\nmodifier\n\npackaging\n\n例如：\n\n普通玻璃\n\n中空玻璃\n\n\
            钢化玻璃\n\nLOW-E玻璃\n\n↓\n\nmaterial\n\n矩形\n\n圆形\n\n方形\n\nT型\n\nU型\n\nL型\n\
            \nH型\n\n↓\n\nform\n\n镀锌\n\n喷塑\n\n阳极氧化\n\n拉丝\n\n抛光\n\n↓\n\nsurface_treatment\n\
            \n\n\n白色\n\n灰色\n\n银色\n\n黑色\n\n↓\n\ncolor\n\n==============================\n\
            ⑤ 产品名称\n==============================\n\n如果规格只是产品名称，\n\n例如：\n\n推拉钢门\n\
            \n铝合金龙骨\n\n玻璃纤维网格布\n\n成品荒包石\n\n且无法提取标准字段，\n\n则：\n\nok=false\n\n==============================\n\
            Pattern要求\n==============================\n\npattern 必须：\n\nPython re.compile\
            \ 可以编译。\n\n至少包含一种：\n\n()\n\n[]\n\n|\n\n\\d\n\n\\w\n\n\\s\n\n禁止：\n\n^.*$\n\
            \n^(.*)$\n\n禁止 catch-all。\n\n禁止生成只能匹配当前输入的固定字符串规则。\n\n除标准行业枚举外，必须具有泛化能力。\n\
            \n==============================\nCode Block要求\n==============================\n\
            \nPython3 合法。\n\n输入变量统一使用：\n\ns\n\n第一行必须：\n\nm=re.match(...,s)\n\n或\n\n\
            m=re.search(...,s)\n\n之后只能：\n\nif m:\n    result['字段']=m.group(N)\n\n\
            值必须来自：\n\nm.group()\n\n或\n\nm.groups()\n\n允许：\n\nm.group(1)+'mm'\n\n禁止：\n\
            \nresult['x']=\"固定字符串\"\n\nresult['type']=\"固定字符串\"\n\n禁止：\n\nimport\n\
            \nexec\n\neval\n\nopen\n\nlambda\n\n==============================\n字段要求\n\
            ==============================\n\nattr 只能使用系统允许字段。\n\n同一 item 内 attr 不得重复。\n\
            \nattr 不得为空。\n\n==============================\n单位要求\n==============================\n\
            \n以下字段必须带单位：\n\ndiameter\n\nlength\n\nwidth\n\nheight\n\nthickness\n\n\
            strength\n\npressure\n\nweight\n\n例如：\n\n150mm\n\n1.6MPa\n\n25kg\n\n禁止输出纯数字。\n\
            \n==============================\n尺寸规则\n==============================\n\
            \n规格属于：\n\nL×W×T\n\n输出：\n\nlength\n\nwidth\n\nthickness\n\n规格属于：\n\nW×H×T\n\
            \n输出：\n\nwidth\n\nheight\n\nthickness\n\n缺一不可。\n\n==============================\n\
            水泥规则\n==============================\n\nPO42.5\n\nPC42.5\n\nPSA32.5\n\n\
            仅输出：\n\nstrength\n\n不得输出：\n\ngrade\n\n==============================\n\
            Type安全规则\n==============================\n\n禁止：\n\nresult['type']=\"固定值\"\
            \n\ntype 必须来自：\n\nm.group(N)\n\ntype 长度不得超过30。\n\n包含以下内容直接丢弃 suggestion：\n\
            \n消防\n\n应急照明\n\n疏散指示\n\n桥架\n\n配电箱\n\n喷淋\n\n水泵\n\n钢绞线\n\n厂家\n\nDC12V\n\n\
            标线漆\n\n防水涂料\n\n==============================\n字段选择规则（最高优先级）\n==============================\n\
            \n所有 attr 必须优先从：\n\n{{ref_names}}\n\n中选择。\n\n如果其中存在语义相同或最接近的字段，\n\n必须使用该字段。\n\
            \n不得自行创造字段。\n\n仅当其中不存在对应字段时，\n\n才允许从系统字段白名单中选择最接近字段。\n\n如果仍无法确定，\n\n直接：\n\
            \nok=false\n\nsuggestions=[]\n\n同一个 item 内：\n\nattr 不得重复。\n\nattr 不得为空。\n\
            \n==============================\nConfidence\n==============================\n\
            \nconfidence < 0.70\n\n直接：\n\nok=false\n\nsuggestions=[]\n\n==============================\n\
            最终原则\n==============================\n\n数值规格优先于一切。\n\n型号规格优先于枚举规格。\n\n\
            枚举规格优先于产品名称。\n\n不能提取标准属性时：\n\nok=false。\n\n宁可拒绝，也不要生成低质量规则。"
        - id: 1109866a-14ab-4c99-8609-adcc06503dbd
          role: user
          text: '## 输入（{batch_size} 条规格）

            每行: [序号] 规格: <spec> | 产品: <breed> | 分类: <category>


            {{#start.specs_str#}}



            ## 输出（严格 JSON 数组，遵循 system 全部 12 条规则）

            输入几条输出几条，顺序一致；ok=false 时 suggestions 为空数组。

            '
        selected: true
        structured_output_enabled: false
        title: 规格解析推理（LLM）
        type: llm
        variables:
        - value_selector:
          - start
          - specs_str
          variable: specs_str
        - value_selector:
          - start
          - ref_names
          variable: ref_names
        - value_selector:
          - start
          - batch_size
          variable: batch_size
        vision:
          enabled: false
      height: 148
      id: llm_parse
      position:
        x: 334
        y: 321
      positionAbsolute:
        x: 334
        y: 321
      selected: true
      type: custom
      width: 242
    - data:
        code: "import json\nimport re\n\n\ndef _extract_json(text: str) -> str:\n\
          \    text = (text or \"\").strip()\n\n    # 去掉 think 标签\n    text = re.sub(\n\
          \        r\"<think>.*?</think>\",\n        \"\",\n        text,\n      \
          \  flags=re.S | re.I,\n    ).strip()\n\n    # 去掉 markdown json\n    m =\
          \ re.search(\n        r\"```(?:json)?\\s*([\\s\\S]*?)```\",\n        text,\n\
          \        re.I,\n    )\n    if m:\n        text = m.group(1).strip()\n\n\
          \    # 优先找 JSON 数组：[ { ... } ]\n    m = re.search(\n        r\"(\\[\\s*\\\
          {[\\s\\S]*\\}\\s*\\])\",\n        text,\n        re.S,\n    )\n    if m:\n\
          \        return m.group(1).strip()\n\n    # 再找 JSON 对象：{ ... }\n    m =\
          \ re.search(\n        r\"(\\{[\\s\\S]*\\})\",\n        text,\n        re.S,\n\
          \    )\n    if m:\n        return m.group(1).strip()\n\n    return \"\"\n\
          \n\ndef _repair_json(text: str) -> str:\n    text = text or \"\"\n\n   \
          \ # 去掉尾逗号\n    text = re.sub(\n        r\",\\s*([\\]}])\",\n        r\"\\\
          1\",\n        text,\n    )\n\n    return text\n\n\ndef main(llm_output):\n\
          \    out = {\n        \"ok\": False,\n        \"results\": [],\n       \
          \ \"err_msg\": \"\",\n    }\n\n    try:\n        raw = _extract_json(llm_output)\n\
          \n        if not raw:\n            out[\"err_msg\"] = \"json not found\"\
          \n            return out\n\n        raw = _repair_json(raw)\n\n        try:\n\
          \            data = json.loads(raw)\n        except Exception:\n       \
          \     # 再尝试修一次\n            raw = re.sub(\n                r\",\\s*([\\\
          ]}])\",\n                r\"\\1\",\n                raw,\n            )\n\
          \            data = json.loads(raw)\n\n        # 顶层数组\n        if isinstance(data,\
          \ list):\n            out[\"ok\"] = True\n            out[\"results\"] =\
          \ data\n            return out\n\n        # {\"results\":[...]}\n      \
          \  if (\n            isinstance(data, dict)\n            and isinstance(data.get(\"\
          results\"), list)\n        ):\n            out[\"ok\"] = True\n        \
          \    out[\"results\"] = data[\"results\"]\n            return out\n\n  \
          \      # 单个对象\n        if isinstance(data, dict):\n            out[\"ok\"\
          ] = True\n            out[\"results\"] = [data]\n            return out\n\
          \n        out[\"err_msg\"] = (\n            \"unexpected type: \"\n    \
          \        + type(data).__name__\n        )\n        return out\n\n    except\
          \ Exception as e:\n        out[\"err_msg\"] = str(e)\n        return out"
        code_language: python3
        desc: 从 LLM 输出中健壮提取 JSON（剥离 ``` 围栏、前缀说明、尾部注释），并按 Dify 声明类型反序列化
        outputs:
          err_msg:
            children: null
            type: string
          ok:
            children: null
            type: boolean
          results:
            children: null
            type: array[object]
        selected: false
        title: JSON 提取与结构化
        type: code
        variables:
        - value_selector:
          - llm_parse
          - text
          variable: llm_output
      height: 112
      id: code_parse2
      position:
        x: 642.1472
        y: 321
      positionAbsolute:
        x: 642.1472
